server:
  port: 8085 #端口

spring:
  application:
    name: hk_one_server
  datasource:
    name: campus_app_database  #数据库名
    url: jdbc:mysql://localhost:3308/hk_one_db?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC #url
    username: root  #用户名
    password: zsdev  #密码
    driver-class-name: com.mysql.cj.jdbc.Driver  #数据库链接驱动

# Mybatis-Plus 数据库框架
mybatis-plus:
  # 搜索指定包别名---配置实体类
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  # 配置mapper的扫描，找到所有的mapper.xml映射文件---配置映射文件，与包名下mapper目录中带有@Mapper注解接口进行数据交互
  type-aliases-package: com.zhangsong.hk.entity
  # 加载全局参数配置文件
  config-location: classpath:mybatis-config.xml

# Sa-Token配置
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: HK
  # token前缀
  # token-prefix: HK
  # token有效期，单位s 默认30天, -1代表永不过期
  active-timeout:  2592000
  # token临时有效期 (指定时间内无操作就视为token过期) 单位: 秒
  -timeout: -1
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: false
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid # 随机64位字符串
  # 是否输出操作日志
  is-log: false
  # 是否尝试从 cookie 里读取 Token ，默认值 true
  isReadCookie: true
  # 是否尝试从 header 里读取 Token，默认值 true
  isReadHead: true
  # 是否尝试从 请求体 里读取 Token，默认值 true
  isReadBody: true
  # 获取 Token-Session 时是否必须登录 (如果配置为true，会在每次获取 Token-Session 时校验是否登录) 默认值 true
  tokenSessionCheckLogin: true


